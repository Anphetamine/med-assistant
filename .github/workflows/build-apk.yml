name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name med_assistant --org com.example app

      - name: Write app code
        run: |
          cat > app/pubspec.yaml <<'EOF'
          name: med_assistant
          description: Simple local medication assistant
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2

          flutter:
            uses-material-design: true
          EOF

          cat > app/lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() => runApp(const MedApp());

          class MedApp extends StatelessWidget {
            const MedApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '用药助手',
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.teal),
                home: const HomePage(),
              );
            }
          }

          class Med {
            String id;
            String name;
            String dose;
            String frequency;
            bool takenToday;
            Med({required this.id, required this.name, required this.dose, required this.frequency, this.takenToday = false});

            Map<String, dynamic> toJson() => {
              'id': id,
              'name': name,
              'dose': dose,
              'frequency': frequency,
              'takenToday': takenToday,
              'date': todayKey(),
            };

            static Med fromJson(Map<String, dynamic> j) => Med(
              id: j['id'] as String,
              name: j['name'] as String,
              dose: j['dose'] as String? ?? '',
              frequency: j['frequency'] as String? ?? '',
              takenToday: (j['date'] == todayKey()) ? (j['takenToday'] as bool? ?? false) : false,
            );
          }

          String todayKey() {
            final d = DateTime.now();
            return '${d.year}-${d.month}-${d.day}';
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});
            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            final List<Med> meds = [];
            final nameCtrl = TextEditingController();
            final doseCtrl = TextEditingController();
            final freqCtrl = TextEditingController();
            bool loading = true;

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final sp = await SharedPreferences.getInstance();
              final raw = sp.getString('meds');
              if (raw != null) {
                final list = jsonDecode(raw) as List;
                meds.addAll(list.map((e) => Med.fromJson(e as Map<String, dynamic>)));
              }
              setState(() => loading = false);
            }

            Future<void> save() async {
              final sp = await SharedPreferences.getInstance();
              await sp.setString('meds', jsonEncode(meds.map((e) => e.toJson()).toList()));
            }

            void addMed() {
              final name = nameCtrl.text.trim();
              if (name.isEmpty) return;
              setState(() {
                meds.add(Med(
                  id: DateTime.now().microsecondsSinceEpoch.toString(),
                  name: name,
                  dose: doseCtrl.text.trim(),
                  frequency: freqCtrl.text.trim(),
                ));
                nameCtrl.clear();
                doseCtrl.clear();
                freqCtrl.clear();
              });
              save();
            }

            void toggle(Med m) {
              setState(() => m.takenToday = !m.takenToday);
              save();
            }

            void delete(Med m) {
              setState(() => meds.remove(m));
              save();
            }

            void showAddDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('添加药品'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: '药品名称 *')),
                        TextField(controller: doseCtrl, decoration: const InputDecoration(labelText: '剂量，如 1片/5ml')),
                        TextField(controller: freqCtrl, decoration: const InputDecoration(labelText: '频次，如 每日2次')),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('取消')),
                    FilledButton(
                      onPressed: () {
                        addMed();
                        Navigator.pop(ctx);
                      },
                      child: const Text('保存'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              if (loading) {
                return const Scaffold(body: Center(child: CircularProgressIndicator()));
              }
              return Scaffold(
                appBar: AppBar(title: const Text('用药助手（本地版）')),
                body: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(12),
                      color: Colors.amber.shade100,
                      child: const Text(
                        '免责声明：本应用仅用于个人用药记录，不提供诊断或用药建议。用药请遵医嘱。',
                        style: TextStyle(fontSize: 12),
                      ),
                    ),
                    Expanded(
                      child: meds.isEmpty
                          ? const Center(child: Text('还没有药品，点右下角 + 添加'))
                          : ListView.builder(
                              itemCount: meds.length,
                              itemBuilder: (ctx, i) {
                                final m = meds[i];
                                return Card(
                                  child: ListTile(
                                    leading: Checkbox(
                                      value: m.takenToday,
                                      onChanged: (_) => toggle(m),
                                    ),
                                    title: Text(m.name),
                                    subtitle: Text(
                                      [m.dose, m.frequency].where((e) => e.isNotEmpty).join(' · '),
                                    ),
                                    trailing: IconButton(
                                      icon: const Icon(Icons.delete_outline),
                                      onPressed: () => delete(m),
                                    ),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: showAddDialog,
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
          EOF

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: med-assistant-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 用药助手 v1.0.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-debug.apk
